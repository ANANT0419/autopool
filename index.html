<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AutoPool">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">

<title>AutoPool · CDL ⇄ Campus</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--y:#facc15;--y2:#fef9c3;--g:#16a34a;--g2:#dcfce7;--r:#dc2626;--b:#2563eb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:110px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:19px;flex:1}.logo span{color:var(--y)}
.ib{width:36px;height:36px;border-radius:10px;background:#1f2937;display:grid;place-items:center;font-size:17px;position:relative}
.dot{position:absolute;top:-3px;right:-3px;background:var(--r);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 3px}
.inst{background:var(--y);color:var(--ink);font-size:14px;font-weight:600;padding:8px 12px;display:flex;align-items:center;gap:10px}.inst span{flex:1}.inst #instBtn{background:var(--ink);color:#fff;padding:6px 14px;border-radius:8px}
.demo{background:#fff7ed;color:#9a3412;font-size:12.5px;padding:7px 12px;text-align:center}
.mz{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px 10px;border-radius:20px;
  background:radial-gradient(circle at 18% 30%,#fff7c2 0,#fef3c7 35%,#fde68a 100%);border:1px solid #fcd34d;position:relative;overflow:hidden}
.mz:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#11182714 0 18px,transparent 18px 30px)}
.mz{flex-direction:column;align-items:stretch;padding:8px 14px 18px;gap:6px}
.mz svg{width:min(62vw,250px);height:min(62vw,250px);align-self:center;margin:-4px 0 -10px;flex:none;overflow:visible;touch-action:pan-y;filter:drop-shadow(0 6px 8px #92400e33);position:relative;z-index:1}
.bub{position:relative;z-index:1;background:#fff;border:1px solid #fcd34d;border-radius:16px;padding:11px 13px;font-size:14.5px;font-weight:600;line-height:1.4;flex:1;box-shadow:0 4px 14px #92400e1f;transition:transform .25s}
.bub small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:3px}
.bub.urgent{background:#fff1f2;border-color:#fda4af}
.bub.good{background:#f0fdf4;border-color:#86efac}
.bub:before{content:"";position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.bub{text-align:center;font-size:15.5px}
.bj{margin-top:9px;padding:9px 18px}
.invite{display:block;width:100%;margin-top:22px;padding:13px;border-radius:14px;background:#dcfce7;color:#166534;font-weight:800;border:1.5px dashed #22c55e}
.credit{text-align:center;color:var(--mute);font-size:12px;margin:22px 0 4px;letter-spacing:.02em}.credit b{color:var(--ink);letter-spacing:.12em}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}55%{transform:translateY(0)}70%{transform:translateY(-5px)}}
.mz svg.hop{animation:hop .6s ease}
.bub.pop{transform:scale(1.04)}
.lid{transform-box:fill-box;transform-origin:50% 0}
.shut{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.sc small{color:var(--mute);font-size:11.5px;display:block}
.sc b{font-size:16px}.sc em{font-style:normal;color:var(--g);font-size:12.5px;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e5e7eb;border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px;border-radius:9px;font-weight:600;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.tabs .n{background:var(--y);color:var(--ink);border-radius:9px;font-size:11px;padding:1px 6px;margin-left:4px}
h3{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px}
.bulb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:12px}
.bulb.on{background:#fffbeb;border-color:var(--y)}
.bh{display:flex;align-items:center;gap:10px}.bh .bi{font-size:26px;filter:grayscale(1);opacity:.5}.bulb.on .bh .bi{filter:none;opacity:1}
.bh .bt{flex:1;line-height:1.3}.bh .bt small{display:block;color:var(--mute);font-size:12.5px}
.sw{width:50px;height:30px;border-radius:15px;background:#d1d5db;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--g)}.sw.on:after{left:23px}
.bp{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:5px}
.bfix{margin-top:10px;width:100%;padding:12px}
.ride{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.ride.mine{border-color:var(--y);box-shadow:0 0 0 2px var(--y2)}
.ride.full{opacity:.6}
.rt{display:flex;align-items:baseline;gap:8px}
.rt b{font-size:20px}.cd{font-weight:700;font-size:13px;padding:2px 8px;border-radius:8px;background:var(--y2)}
.cd.go{background:#fee2e2;color:var(--r)}
.seats{margin-left:auto;display:flex;gap:3px}
.seat{width:14px;height:14px;border-radius:4px;background:var(--line)}.seat.t{background:var(--ink)}
.ppl{margin:9px 0;display:flex;flex-direction:column;gap:5px}
.p{display:flex;align-items:center;gap:8px;font-size:14px}
.p .av{width:26px;height:26px;border-radius:50%;background:var(--y2);display:grid;place-items:center;font-weight:700;font-size:12px}
.p .nm{flex:1}.p .x{color:var(--mute);font-size:12px}
.call{background:var(--g2);color:var(--g);padding:5px 10px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none}
.acts{display:flex;gap:8px;align-items:center}
.fare{font-size:13px;color:var(--mute);flex:1}.fare b{color:var(--ink)}
.btn{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700}
.btn.y{background:var(--y);color:var(--ink)}.btn.g{background:var(--g);color:#fff}
.btn.ghost{background:#f3f4f6;color:var(--ink)}.btn.red{background:#fee2e2;color:var(--r)}
.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--mute);padding:28px 10px;background:var(--card);border-radius:14px;border:1px dashed var(--line)}
.empty div{font-size:34px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:492px;background:var(--y);color:var(--ink);font-weight:800;font-size:17px;padding:16px;border-radius:16px;box-shadow:0 6px 20px #0003;z-index:6}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:19px;margin-bottom:12px;display:flex;align-items:center}.sheet h2 button{margin-left:auto;font-size:22px;color:var(--mute)}
.lbl{font-size:13px;color:var(--mute);margin:12px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:10px;background:#f3f4f6;font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.nudge{background:var(--g2);color:#14532d;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.fld{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:16px}
.row{display:flex;gap:8px;margin-top:16px}.row .btn{flex:1;padding:13px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;display:none}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:45vh;overflow:auto;white-space:pre-wrap}
.log .e{color:var(--r)}.log .w{color:#b45309}.log .i{color:var(--mute)}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.note code{background:#f3f4f6;padding:1px 5px;border-radius:5px;color:var(--ink)}
.login{position:fixed;inset:0;background:var(--ink);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
.login.show{display:flex}
.login .box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:400px}
.login h1{font-size:24px;margin-bottom:4px}.login p{color:var(--mute);font-size:14px;margin-bottom:16px}
.lang{font-size:14px;font-weight:800;color:var(--y)}
.acts{flex-wrap:wrap}
.ok{color:var(--g);font-size:12px;font-weight:700;margin-left:4px}
.gatebtn{width:100%;margin-top:10px;padding:11px}
.usual{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}
.usual .ul{font-size:12.5px;color:var(--mute);font-weight:700;width:100%}
.uchip{display:inline-flex;align-items:center;background:var(--card);border:1.5px solid var(--y);border-radius:12px;overflow:hidden}
.uchip button{padding:9px 12px;font-weight:700}.uchip .ux{padding:9px 10px;color:var(--mute);border-left:1px solid var(--line)}
.settle{background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:12px 13px;margin-top:12px}
.settle .sh{font-weight:800;font-size:13px;color:#14532d;margin-bottom:6px}.settle p{margin:4px 0 8px;font-size:14.5px}
a.btn{text-decoration:none;display:inline-block}
.set{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.set span{flex:1}.set small{display:block;color:var(--mute);font-size:12.5px}
.lglang{float:right;font-size:13px;font-weight:700;color:var(--b);padding:4px 0}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
/* 🔠 big text & high contrast */
body.big{--mute:#1f2937;--line:#6b7280;--bg:#fff}
body.big main,body.big .sheet,body.big .fab,body.big .login .box{zoom:1.2}
body.big .btn,body.big .chip,body.big .call{border:2px solid var(--ink)}
body.big .ride,body.big .sc,body.big .bulb,body.big .bub{border-width:2px;border-color:var(--ink)}
body.big .x,body.big .note,body.big small{color:#111827!important}
body.big .fab{bottom:calc(10px + env(safe-area-inset-bottom))}
</style>
</head>

          <g class="pupil"><circle cx="37" cy="57" r="5.4" fill="#111827"/><circle cx="39" cy="54.8" r="1.7" fill="#fff"/></g>
          <g class="pupil"><circle cx="63" cy="57" r="5.4" fill="#111827"/><circle cx="65" cy="54.8" r="1.7" fill="#fff"/></g>
          <ellipse class="lid" cx="37" cy="56" rx="10.8" ry="11.8" fill="#fde68a" stroke="#111827" stroke-width="1.6"/>
          <ellipse class="lid" cx="63" cy="56" rx="10.8" ry="11.8" fill="#fde68a" stroke="#111827" stroke-width="1.6"/>

<button class="fab" id="fab" data-glance></button>

<!-- Leave sheet -->
<div class="ov" id="ovLeave" role="dialog"><div class="sheet">
  <h2><span id="leaveTitle"></span><button data-close data-al="Close|बंद करें">✕</button></h2>
  <div class="lbl" data-t="Auto leaves the gate|ऑटो गेट से कब निकलेगा"></div>
  <div class="chips" id="whenChips"></div>
  <div id="atWrap" style="display:none;margin-top:10px"><input type="time" class="fld" id="atTime" data-al="Leaving time|निकलने का समय"></div>

  <div class="chips" id="grpChips"></div></div>
  <label class="chk" id="usualBlock"><input type="checkbox" id="saveUsual"> <span data-t="⭐ Save this time as my usual ride|⭐ यह समय मेरी रोज़ की राइड में सेव करें"></span></label>
  <div id="leaveNudge"></div>
  <div class="row"><button class="btn y" id="goLeave" data-t="Post auto|ऑटो पोस्ट करें"></button></div>
</div></div>

<!-- WhatsApp question (after posting) -->

  <h2><span id="waTitle"></span><button data-close data-al="Close|बंद करें">✕</button></h2>
  <p class="note" style="font-size:15px" id="waNote"></p>
  <div class="row"><button class="btn ghost" id="waNo" data-t="No thanks|नहीं, रहने दें"></button><button class="btn g" id="waYes" data-t="Share on WhatsApp|WhatsApp पर भेजें"></button></div>

  <h2><span data-t="Join this auto|इस ऑटो में जुड़ें"></span><button data-close data-al="Close|बंद करें">✕</button></h2>
  <div class="lbl" data-t="How many of you?|आप कितने लोग हैं?"></div>
  <div class="chips" id="joinChips"></div>
  <div class="row"><button class="btn g" id="goJoin" data-t="Join, I'm coming|जुड़ें, मैं आ रहा/रही हूँ"></button></div>

<!-- Alerts sheet -->
<div class="ov" id="ovAlerts" role="dialog"><div class="sheet">
  <h2><span data-t="Get alerts|अलर्ट पाएँ"></span><button data-close data-al="Close|बंद करें">✕</button></h2>
  <div class="lbl" data-t="1 · While this app is open|1 · जब ऐप खुला हो"></div>

  <div class="row" style="margin-top:8px"><button class="btn ghost" id="bNotif" data-t="Turn on in-app alerts|ऐप अलर्ट चालू करें"></button></div>
  <div class="lbl" style="margin-top:18px" data-t="2 · Even when the app is closed (free ntfy app)|2 · ऐप बंद हो तब भी (मुफ़्त ntfy ऐप)"></div>
  <p class="note" id="ntfyNote"></p>
</div></div>

<!-- Bulb sheet -->
<div class="ov" id="ovBulb" role="dialog"><div class="sheet">

<script type="module">
const C = window.AUTOPOOL_CONFIG;
const APP_VERSION = "2026-11-01-v11";   // bump on every upload → open apps notice and refresh
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EXPIRE_MS = 40 * 1000;        // card shows "Leaving now" for 40 s after leave time, then disappears
const SETTLE_MS = 45 * 60 * 1000;   // "settle up" card stays 45 min after leave time

/* ---------------- Language (English / Hindi) ---------------- */
let lang = localStorage.getItem("ap_lang") || "en";
const tr = (en, hi) => lang === "hi" ? hi : en;
const lbl = d => d === "c2m" ? tr("Campus", "कैंपस") : "CDL";        // where the auto goes
const frm = d => d === "c2m" ? "CDL" : tr("Campus", "कैंपस");        // where it starts
function applyStatic() {
  document.documentElement.lang = lang;
  const pick = v => v.split("|")[lang === "hi" ? 1 : 0] ?? v;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = pick(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el => el.innerHTML = pick(el.dataset.th));
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = pick(el.dataset.ph));
  document.querySelectorAll("[data-al]").forEach(el => { el.setAttribute("aria-label", pick(el.dataset.al)); el.title = pick(el.dataset.al); });
  document.querySelectorAll(".tabs button").forEach(b => b.querySelector(".tl").textContent = tr("To ", "") + lbl(b.dataset.d) + tr("", " की ओर"));
  $("#bLang").textContent = lang === "hi" ? "EN" : "हि";
  $("#lgLang").textContent = lang === "hi" ? "View in English" : "हिंदी में देखें";
}
function setLang(l) { lang = l; localStorage.setItem("ap_lang", l); applyStatic(); if (started) { renderShuttle(); render(); } log("i", "Language: " + l); }

/* ---------------- Big text & high contrast ---------------- */
const setBig = on => { document.body.classList.toggle("big", on); localStorage.setItem("ap_big", on ? "1" : "0"); $("#bigSw").classList.toggle("on", on); $("#bigSw").setAttribute("aria-checked", on); };

/* ---------------- Issue log ---------------- */
const LOGK = "ap_log";
let logs = JSON.parse(localStorage.getItem(LOGK) || "[]");
let unseenErr = 0;
function log(level, msg) {
  logs.push({ t: new Date().toLocaleString("en-IN"), level, msg: String(msg) });
  logs = logs.slice(-200);
  localStorage.setItem(LOGK, JSON.stringify(logs));
  if (level === "e") { unseenErr++; $("#logDot").textContent = unseenErr; $("#logDot").style.display = "grid"; }
}
window.addEventListener("error", e => log("e", `${e.message} @${e.filename?.split("/").pop()}:${e.lineno}`));
window.addEventListener("unhandledrejection", e => log("e", "Promise: " + (e.reason?.message || e.reason)));
function renderLog() {
  $("#logBox").innerHTML = logs.length ? logs.slice().reverse().map(l => `<div class="${l.level}">[${esc(l.t)}] ${l.level.toUpperCase()} ${esc(l.msg)}</div>`).join("") : tr("No issues logged. All good ✅", "कोई समस्या नहीं। सब ठीक ✅");
}

/* ---------------- Shuttle schedule (from the official sheet) ---------------- */
const SHUTTLE = {
  c2m: ["08:30","08:35","08:50","08:55","10:05","10:20","11:40","11:55","13:55","15:15","15:35","17:00","17:10","17:55","18:15","19:15",
        "21:00","22:00","23:00","00:00","01:00","02:00","03:00","04:00","05:00"],
  m2c: ["09:00","09:30","10:45","11:15","11:50","12:30","13:40","14:30","16:00","16:15","17:25","17:30","17:45","18:15","19:00","19:35",
        "21:30","22:30","23:30","00:30","01:30","02:30","03:30","04:30"]
};
function nextShuttle(dir, from = new Date()) {
  let best = null;
  for (const hm of SHUTTLE[dir]) {
    const [h, m] = hm.split(":").map(Number);
    const d = new Date(from); d.setHours(h, m, 0, 0);
    if (d < from) d.setDate(d.getDate() + 1);
    if (!best || d < best) best = d;
  }
  return { at: best, mins: Math.round((best - from) / 60000) };
}
const fmt = d => d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", hour12: true });
const minsTxt = m => m < 60 ? `${m} ${tr("min", "मिनट")}` : `${Math.floor(m/60)}${tr("h", " घंटे")} ${m%60}${tr("m", " मिनट")}`;

/* ---------------- Identity ---------------- */
let me = JSON.parse(localStorage.getItem("ap_me") || "null");
function uidLocal() { let u = localStorage.getItem("ap_uid"); if (!u) { u = "u" + Math.random().toString(36).slice(2, 10); localStorage.setItem("ap_uid", u); } return u; }
const validPhone = p => /^[6-9]\d{9}$/.test(p);
const validUpi = u => /^[\w.\-]{2,}@[a-zA-Z][a-zA-Z0-9.]{1,}$/.test(u);
const hash = s => { let h = 5381; for (const c of String(s)) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); };
const myTopic = () => C.ntfyTopic && me ? `${C.ntfyTopic}-${hash(me.phone)}` : "";   // personal reminder channel (phone not exposed)
let started = false;

/* ---------------- Backend: Firebase or Demo ---------------- */
let api;
async function initBackend() {
  if (C.firebase && C.firebase.apiKey) {
    try {
      const V = "10.12.2";
      const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      const { getAuth, signInAnonymously } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
      const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
      const app = initializeApp(C.firebase);
      const cred = await signInAnonymously(getAuth(app));
      const db = fs.getFirestore(app);
      const col = fs.collection(db, "rides");
      api = {
        uid: cred.user.uid,
        watch(cb) {
          const q = fs.query(col, fs.where("leaveAt", ">", Date.now() - 60 * 60 * 1000));
          return fs.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), s.docChanges().filter(c => c.type === "added").map(c => c.doc.id)),
            e => { log("e", "Live sync failed: " + e.message); toast(tr("Can't sync rides. Check internet.", "राइड सिंक नहीं हो रहीं। इंटरनेट देखें।")); });
        },
        async create(r) { const ref = await fs.addDoc(col, r); return ref.id; },
        async join(id, rider) {
          await fs.runTransaction(db, async tx => {
            const ref = fs.doc(db, "rides", id); const s = await tx.get(ref);
            if (!s.exists()) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है"));
            const r = s.data();
            if (r.cancelled) throw new Error(tr("This auto was cancelled", "यह ऑटो रद्द हो गया"));
            if (r.riders.some(x => x.uid === rider.uid)) return;
            if (used(r) + rider.n > C.seats) throw new Error(tr("Not enough seats left", "इतनी सीटें बाकी नहीं"));
            tx.update(ref, { riders: [...r.riders, rider] });
          });
        },
        async leave(id, uid) {
          await fs.runTransaction(db, async tx => {
            const ref = fs.doc(db, "rides", id); const s = await tx.get(ref); if (!s.exists()) return;
            tx.update(ref, { riders: s.data().riders.filter(x => x.uid !== uid) });
          });
        },
        async cancel(id) { await fs.updateDoc(fs.doc(db, "rides", id), { cancelled: true }); },
        async saveUser(p) {
          const ref = fs.doc(db, "users", cred.user.uid), now = Date.now();
          let isNew = true; try { isNew = !(await fs.getDoc(ref)).exists(); } catch (e) {}
          await fs.setDoc(ref, { uid: cred.user.uid, name: p.name, phone: p.phone, lang, hasUpi: !!p.upi, lastSeen: now, ...(isNew ? { firstSeen: now } : {}) }, { merge: true });
        },
        async setTime(id, leaveAt) {
          await fs.runTransaction(db, async tx => {
            const ref = fs.doc(db, "rides", id); const s = await tx.get(ref); if (!s.exists()) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है"));
            if (s.data().riders.length > 1) throw new Error(tr("Someone already joined, so the time is locked. Call them to change it.", "कोई जुड़ चुका है, समय अब नहीं बदल सकता। उन्हें कॉल करें।"));
            tx.update(ref, { leaveAt });
          });
        },
        async patchRider(id, uid, fields) {
          await fs.runTransaction(db, async tx => {
            const ref = fs.doc(db, "rides", id); const s = await tx.get(ref); if (!s.exists()) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है"));
            tx.update(ref, { riders: s.data().riders.map(x => x.uid === uid ? { ...x, ...fields } : x) });
          });
        },
        async setPayer(id, uid, upi) {
          await fs.runTransaction(db, async tx => {
            const ref = fs.doc(db, "rides", id); const s = await tx.get(ref); if (!s.exists()) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है"));
            tx.update(ref, { payer: uid, riders: s.data().riders.map(x => x.uid === uid ? { ...x, paid: true, ...(upi ? { upi } : {}) } : x) });
          });
        },
        watchBulbs(cb) {
          const q = fs.query(fs.collection(db, "bulbs"), fs.where("until", ">", Date.now()));
          return fs.onSnapshot(q, s => cb(s.docs.map(d => d.data())), e => log("e", "Bulb sync failed: " + e.message));
        },
        async setBulb(b) { await fs.setDoc(fs.doc(db, "bulbs", b.uid), b); },
        async clearBulb(uid) { await fs.setDoc(fs.doc(db, "bulbs", uid), { uid, until: 0 }); }
      };
      log("i", "Connected to Firebase (live mode)");
      return;
    } catch (e) { log("e", "Firebase init failed, falling back to demo: " + e.message); toast(tr("Couldn't connect. Running in demo mode.", "कनेक्ट नहीं हुआ। डेमो मोड चल रहा है।")); }
  }
  // Demo mode: localStorage + sync across tabs on the same device
  $("#demoBar").style.display = "block";
  const K = "ap_rides", bc = "BroadcastChannel" in window ? new BroadcastChannel("ap") : null;
  const read = () => JSON.parse(localStorage.getItem(K) || "[]");
  const write = rs => { localStorage.setItem(K, JSON.stringify(rs)); bc?.postMessage(1); emit(); };
  let cbs = [], seen = new Set(read().map(r => r.id));
  const emit = () => { const rs = read(); const added = rs.filter(r => !seen.has(r.id)).map(r => r.id); added.forEach(i => seen.add(i)); cbs.forEach(cb => cb(rs, added)); };
  const KB = "ap_bulbs", readB = () => JSON.parse(localStorage.getItem(KB) || "[]").filter(b => b.until > Date.now());
  let bcbs = [];
  const emitB = () => bcbs.forEach(cb => cb(readB()));
  const writeB = bs => { localStorage.setItem(KB, JSON.stringify(bs)); bc?.postMessage(2); emitB(); };
  bc && (bc.onmessage = m => m.data === 2 ? emitB() : emit());
  window.addEventListener("storage", e => e.key === K ? emit() : e.key === KB && emitB());
  api = {
    uid: uidLocal(),
    watch(cb) { cbs.push(cb); cb(read(), []); },
    async create(r) { const id = "r" + Date.now().toString(36); write([...read().filter(x => x.leaveAt > Date.now() - 3600e3), { id, ...r }]); return id; },
    async join(id, rider) {
      const rs = read(), r = rs.find(x => x.id === id);
      if (!r) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है"));
      if (r.cancelled) throw new Error(tr("This auto was cancelled", "यह ऑटो रद्द हो गया"));
      if (r.riders.some(x => x.uid === rider.uid)) return;
      if (used(r) + rider.n > C.seats) throw new Error(tr("Not enough seats left", "इतनी सीटें बाकी नहीं"));
      r.riders.push(rider); write(rs);
    },
    async leave(id, uid) { const rs = read(), r = rs.find(x => x.id === id); if (r) { r.riders = r.riders.filter(x => x.uid !== uid); write(rs); } },
    async cancel(id) { const rs = read(), r = rs.find(x => x.id === id); if (r) { r.cancelled = true; write(rs); } },
    async saveUser() {},
    async setTime(id, leaveAt) { const rs = read(), r = rs.find(x => x.id === id); if (!r) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है")); if (r.riders.length > 1) throw new Error(tr("Someone already joined, so the time is locked. Call them to change it.", "कोई जुड़ चुका है, समय अब नहीं बदल सकता। उन्हें कॉल करें।")); r.leaveAt = leaveAt; write(rs); },
    async patchRider(id, uid, fields) { const rs = read(), r = rs.find(x => x.id === id); if (!r) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है")); r.riders = r.riders.map(x => x.uid === uid ? { ...x, ...fields } : x); write(rs); },
    async setPayer(id, uid, upi) { const rs = read(), r = rs.find(x => x.id === id); if (!r) throw new Error(tr("Ride no longer exists", "यह राइड अब नहीं है")); r.payer = uid; r.riders = r.riders.map(x => x.uid === uid ? { ...x, paid: true, ...(upi ? { upi } : {}) } : x); write(rs); },
    watchBulbs(cb) { bcbs.push(cb); cb(readB()); },
    async setBulb(b) { writeB([...readB().filter(x => x.uid !== b.uid), b]); },
    async clearBulb(uid) { writeB(readB().filter(x => x.uid !== uid)); }
  };
  log("i", "Demo mode (no Firebase config)");
}

/* ---------------- State & render ---------------- */
const fareFor = n => C.fares[Math.min(Math.max(n, 1), C.seats)];   // total auto fare for n people
const perHead = n => Math.ceil(fareFor(n) / Math.max(n, 1));         // what each person pays
const used = r => r.riders.reduce((a, x) => a + (x.n || 1), 0);
let rides = [], tab = "c2m", bootAt = Date.now();
const live = () => rides.filter(r => !r.cancelled && r.leaveAt > Date.now() - EXPIRE_MS).sort((a, b) => a.leaveAt - b.leaveAt);
const myRide = () => live().find(r => r.riders.some(x => x.uid === api.uid));
const meIn = r => r.riders.find(x => x.uid === api.uid);
let dismissed = new Set(JSON.parse(localStorage.getItem("ap_dismiss") || "[]"));
const settleRides = () => rides.filter(r => !r.cancelled && r.leaveAt <= Date.now() && r.leaveAt > Date.now() - SETTLE_MS
  && meIn(r) && r.riders.length > 1 && !dismissed.has(r.id));
const cdText = ms => ms <= 0 ? tr("Leaving now", "अभी निकल रहा") : ms < 60000 ? `${Math.ceil(ms/1000)}s` : tr(`in ${Math.ceil(ms/60000)} min`, `${Math.ceil(ms/60000)} मिनट में`);

function renderShuttle() {
  $("#shut").innerHTML = ["c2m", "m2c"].map(d => {
    const s = nextShuttle(d);
    return `<div class="sc"><small>${tr("Next shuttle", "अगली शटल")} ${frm(d)} → ${lbl(d)}</small><b>${fmt(s.at)}</b> <em>${tr("in", "")} ${minsTxt(s.mins)}${tr("", " में")}</em></div>`;
  }).join("");
}

/* ---- usual rides (one-tap) ---- */
let usual = JSON.parse(localStorage.getItem("ap_usual") || "[]");
const saveUsualList = () => localStorage.setItem("ap_usual", JSON.stringify(usual));
const usualAt = hm => { const [h, m] = hm.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d; };
function renderUsual() {
  const list = usual.filter(u => u.dir === tab).sort((a, b) => a.hm.localeCompare(b.hm));
  if (!list.length || myRide()) { $("#usual").innerHTML = ""; return; }
  $("#usual").innerHTML = `<div class="usual"><span class="ul">${tr("⭐ My usual · tap to post", "⭐ रोज़ की राइड · टैप करें")}</span>

/* ---- 💸 settle up (UPI split) ---- */

        ${me.upi ? "" : `<p class="note">${tr("Tip: add your UPI ID in 👤 so others can pay you in one tap.", "सुझाव: 👤 में अपना UPI ID डालें ताकि लोग एक टैप में दे सकें।")}</p>`}`;
    }

        <div class="acts">${upi ? `<a class="btn g" href="${upi}">💸 ${tr("Pay via UPI", "UPI से दें")}</a><button class="btn ghost" data-copy="${esc(payer.upi)}">${tr("Copy UPI ID", "UPI ID कॉपी")}</button>` : `<a class="call" href="tel:${esc(payer.phone)}">📞 ${tr("Ask for UPI / pay cash", "UPI पूछें / नकद दें")}</a>`}

}

/* ---------------- Alerts ---------------- */
function toast(t, ms = 2600) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", ms); }
function notify(title, body, tag) {
  if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
    try { new Notification(title, { body, tag }); } catch (e) { log("w", "Notification failed: " + e.message); }
  }
}
function alertNew(r) {
  const u = r.riders.find(x => x.uid === r.creator), who = u?.name || tr("Someone", "कोई");
  const msg = tr(`${who} → ${lbl(r.dir)} at ${fmt(new Date(r.leaveAt))} · ${C.seats - used(r)} seats`, `${who} → ${lbl(r.dir)}, ${fmt(new Date(r.leaveAt))} · ${C.seats - used(r)} सीट`);
  const mb = myBulb();
  if (mb && mb.dir === r.dir) { toast(tr(`💡 ${who} fixed ${fmt(new Date(r.leaveAt))} to ${lbl(r.dir)}, you're flexible. Join?`, `💡 ${who} ने ${fmt(new Date(r.leaveAt))} तय किया, आप फ़्री हैं। जुड़ें?`), 6000); navigator.vibrate?.([200, 80, 200, 80, 200]); tab = r.dir; render(); }
  else toast("🛺 " + msg, 4000);
  setTimeout(() => { mascot?.react(); mascot?.lookAt($(".ride")); }, 50);
  navigator.vibrate?.([120, 60, 120]);
  notify(tr("Auto leaving", "ऑटो निकल रहा है"), msg, r.id);
}
// ⏰ reminder 3 min before your auto (in-app). The ntfy one below covers a closed app.
const reminded = new Set();
function checkReminder() {
  const r = myRide(); if (!r || reminded.has(r.id)) return;
  const ms = r.leaveAt - Date.now();
  if (ms > 0 && ms <= 180000) {
    reminded.add(r.id);
    const msg = tr(`Your auto leaves at ${fmt(new Date(r.leaveAt))}. Head to the main gate!`, `आपका ऑटो ${fmt(new Date(r.leaveAt))} पर निकलेगा। मेन गेट पर पहुँचें!`);
    toast("⏰ " + msg, 7000); navigator.vibrate?.([300, 100, 300, 100, 300]); mascot?.react();
    notify("⏰ AutoPool", msg, "rem" + r.id); log("i", "Reminder shown " + r.id);
  }
}
async function scheduleReminder(r) {
  const at = r.leaveAt - 180000;
  if (at - Date.now() < 20000) { reminded.add(r.id); return; }   // too close: no reminder needed, don't buzz right away either
  if (!myTopic()) return;
  try {
    const res = await fetch(`https://ntfy.sh/${encodeURIComponent(myTopic())}?delay=${Math.floor(at / 1000)}`, {
      method: "POST",
      body: tr(`Your auto to ${lbl(r.dir)} leaves at ${fmt(new Date(r.leaveAt))}. Head to the main gate! (Ignore if you left the auto.)`, `${lbl(r.dir)} का आपका ऑटो ${fmt(new Date(r.leaveAt))} पर निकलेगा। मेन गेट पर पहुँचें! (ऑटो छोड़ दिया हो तो ध्यान न दें।)`),
      headers: { Title: "AutoPool: your auto leaves in 3 min", Tags: "alarm_clock", Click: location.href.split("#")[0] }
    });
    log(res.ok ? "i" : "w", res.ok ? `Reminder scheduled for ${fmt(new Date(at))}` : "Reminder HTTP " + res.status);
  } catch (e) { log("w", "Reminder schedule failed: " + e.message); }
}

async function postRide(leaveAt, g, wantWa = true) {
  if (myRide()) { toast(tr("You're already in an auto", "आप पहले से एक ऑटो में हैं")); return false; }
  if (!leaveAt || leaveAt < Date.now() - 30000) { toast(tr("Pick a time later than now", "अभी के बाद का समय चुनें")); return false; }
  if (leaveAt > Date.now() + 12 * 3600e3) { toast(tr("You can post up to 12 hours ahead", "12 घंटे पहले तक ही पोस्ट कर सकते हैं")); return false; }
  const r = { dir: tab, leaveAt: Math.max(leaveAt, Date.now() + 30000), createdAt: Date.now(), creator: api.uid, riders: [rider(g)], cancelled: false };
  r.id = await api.create(r);
  log("i", `Posted ride ${r.id} ${tab} at ${fmt(new Date(r.leaveAt))}`);
  if (myBulb()) api.clearBulb(api.uid).catch(e => log("w", "Bulb clear failed: " + e.message));
  toast(tr("Posted! Others can see it now ✅", "पोस्ट हो गया! अब सबको दिख रहा है ✅"));
  ntfyPush(r); scheduleReminder(r);
  if (wantWa) askWa(tr("✅ Auto posted!", "✅ ऑटो पोस्ट हो गया!"), tr("Tell the hostel WhatsApp group? More people see it, your seats fill faster.", "हॉस्टल के WhatsApp ग्रुप में बताएँ? ज़्यादा लोग देखेंगे, सीटें जल्दी भरेंगी।"), shareText(r));
  mascot?.react("happy");
  return true;
}

/* ---------------- Chhotu the mascot (2D port of the Inku follow behaviour) ----------------
   Eyes lead on a fast spring (ω=22), the head follows on a slower one (ω=6.5), both critically damped (no bounce).
   Desktop: follows the cursor. Phone: looks where you tap, glances around on its own every 3–6 s.
   Blinks every 2.5–5.5 s (20% double), blinks on click, brows jump on fast flicks / news, idle → eye contact. */
let mascot = null;
function initMascot() {
  const svg = $("#mascot"); if (!svg) return null;
  const head = $("#mHead"), face = $("#mFace"), mouth = $("#mMouth");
  const pupils = [...svg.querySelectorAll(".pupil")], lids = [...svg.querySelectorAll(".lid")], brows = [...svg.querySelectorAll(".brow")];
  const browBase = brows.map(b => b.getAttribute("transform"));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const touch = matchMedia("(pointer: coarse)").matches;
  const s = { gy: 0, gp: 0, yaw: 0, pitch: 0, yawV: 0, pitchV: 0, roll: 0, ey: 0, ep: 0, eyV: 0, epV: 0,
    blink: 0, blinkT: -1, nextBlink: performance.now() + 3000, dbl: false, brow: 0, browT: 0,
    pointer: null, lastInput: -1e9, glance: null, tap: null, script: null, nextScript: 0, smile: 0, smileT: 0, visible: true };

  addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    const prev = s.pointer; s.pointer = { x: e.clientX, y: e.clientY }; s.lastInput = performance.now();
    if (prev && Math.hypot(e.clientX - prev.x, e.clientY - prev.y) > 120) s.browT = 1;   // fast flick → surprised
  }, { passive: true });
  document.addEventListener("pointerleave", () => s.pointer = null);
  addEventListener("touchmove", e => { const t = e.touches[0]; if (t) { s.tap = { x: t.clientX, y: t.clientY, until: performance.now() + 900 }; s.lastInput = performance.now(); } }, { passive: true });
  addEventListener("scroll", () => { s.lastInput = performance.now(); }, { passive: true });
  addEventListener("pointerdown", e => {
    s.blinkT = 0; s.lastInput = performance.now();                                       // a click/tap = a blink
    if (e.pointerType === "touch") s.tap = { x: e.clientX, y: e.clientY, until: performance.now() + 1600 };
  }, { passive: true });
  // glance at buttons (event delegation, because cards re-render)
  const glanceSel = "[data-glance], [data-join], #bulbSw, #bulbFix, .call";
  document.addEventListener("pointerover", e => { const el = e.target.closest?.(glanceSel); if (el) { s.glance = el; if (el.matches("#fab,[data-join],#bulbFix")) s.browT = 1; } });
  document.addEventListener("pointerout", e => { if (s.glance && !s.glance.contains(e.relatedTarget)) s.glance = null; });
  document.addEventListener("focusin", e => { const el = e.target.closest?.(glanceSel); if (el) s.glance = el; });
  document.addEventListener("focusout", () => s.glance = null);
  new IntersectionObserver(([en]) => s.visible = en.isIntersecting).observe(svg);

  // screen point → total gaze (-1..1). The mascot itself is "straight ahead"; each screen edge = full turn on that side.
  function gaze(x, y) {
    const r = svg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.55;
    return { yaw: clamp((x - cx) / Math.max(1, x > cx ? innerWidth - cx : cx), -1, 1),
             pitch: clamp((y - cy) / Math.max(1, y > cy ? innerHeight - cy : cy), -1, 1) };
  }
  const centreOf = el => { const r = el.getBoundingClientRect(); return r.width ? gaze(r.left + r.width / 2, r.top + r.height / 2) : null; };
  function target(now) {
    const idle = now - s.lastInput > 4000;
    let g = null;
    if (s.tap && now < s.tap.until) g = gaze(s.tap.x, s.tap.y);
    else if (s.glance && document.contains(s.glance)) g = centreOf(s.glance);
    else if (!touch && s.pointer && !idle) g = gaze(s.pointer.x, s.pointer.y);
    else if (touch) {
      if (now > s.nextScript) {
        const opts = ["you", "you", "around", "fab", "ride"];
        s.script = opts[Math.floor(Math.random() * opts.length)];
        s.scriptPt = [Math.random() * innerWidth, Math.random() * innerHeight * 0.8];
        s.nextScript = now + 2000 + Math.random() * 2500;
      }
      const el = s.script === "fab" ? $("#fab") : s.script === "ride" ? $(".ride") : null;
      if (el && el.offsetParent) g = centreOf(el); else if (s.script === "around") g = gaze(...s.scriptPt);
    }
    if (!g) { const t = now / 1000; g = { yaw: Math.sin(t * 0.7) * 0.06, pitch: Math.sin(t * 0.43) * 0.06 }; }  // eye contact + slow drift
    return g;
  }

  function update(dt, now) {
    const g = target(now);
    s.gy = damp(s.gy, g.yaw, 30, dt); s.gp = damp(s.gp, g.pitch, 30, dt);                // de-jitter raw input
    const yT = clamp(s.gy * 0.8, -0.7, 0.7), pT = clamp(s.gp * 0.7, -0.5, 0.6);         // head takes most of the turn
    const W = 6.5; s.yawV += (-2 * W * s.yawV - W * W * (s.yaw - yT)) * dt; s.yaw += s.yawV * dt;
    s.pitchV += (-2 * W * s.pitchV - W * W * (s.pitch - pT)) * dt; s.pitch += s.pitchV * dt;
    s.roll = damp(s.roll, clamp(-s.yawV * 4, -7, 7), 6, dt);                            // small tilt while turning
    const eyT = clamp(s.gy - s.yaw, -0.6, 0.6), epT = clamp(s.gp - s.pitch, -0.5, 0.5); // eyes: what the head hasn't turned yet
    const E = 22; s.eyV += (-2 * E * s.eyV - E * E * (s.ey - eyT)) * dt; s.ey += s.eyV * dt;
    s.epV += (-2 * E * s.epV - E * E * (s.ep - epT)) * dt; s.ep += s.epV * dt;
    // blink every 2.5–5.5 s, sometimes twice
    if (now > s.nextBlink && s.blinkT < 0) { s.blinkT = 0; s.nextBlink = now + 2500 + Math.random() * 3000; s.dbl = Math.random() < 0.2; }
    if (s.blinkT >= 0) { s.blinkT += dt; const d = 0.16; s.blink = s.blinkT < d ? Math.sin(s.blinkT / d * Math.PI) : 0;
      if (s.blinkT >= d) { s.blinkT = -1; if (s.dbl) { s.dbl = false; s.nextBlink = now + 120; } } }
    s.brow = damp(s.brow, s.browT, 12, dt); s.browT = damp(s.browT, 0, 3, dt);
    s.smile = damp(s.smile, s.smileT, 8, dt); s.smileT = damp(s.smileT, 0, 1.2, dt);
    draw(now / 1000);
  }
  function draw(t) {
    const breath = Math.sin(t * Math.PI * 0.5) * 0.6;
    head.setAttribute("transform", `translate(${(s.yaw * 9).toFixed(2)} ${(s.pitch * 4 + breath * 1.6).toFixed(2)}) rotate(${(s.roll * 1.4).toFixed(2)} 50 70)`);
    face.setAttribute("transform", `translate(${(s.yaw * 7).toFixed(2)} ${(s.pitch * 4.5).toFixed(2)})`);   // face slides further than the body = clear 3D head-turn
    const px = clamp((s.ey + s.yaw * 0.6) * 7, -4.4, 4.4), py = clamp((s.ep + s.pitch * 0.6) * 7, -4.8, 4.8);
    pupils.forEach(p => p.setAttribute("transform", `translate(${px.toFixed(2)} ${py.toFixed(2)})`));
    const lidOpen = 0.12 + Math.max(0, -py) * 0.03;                                     // lids follow the gaze up a bit
    lids.forEach(l => l.style.transform = `scaleY(${(lidOpen + (1 - lidOpen) * s.blink).toFixed(3)})`);
    brows.forEach((b, i) => b.setAttribute("transform", `translate(0 ${(-s.brow * 3.5).toFixed(2)}) ${browBase[i]}`));
    const m = 73 + s.smile * 5; mouth.setAttribute("d", `M44 69 Q50 ${m.toFixed(1)} 56 69`);
  }

  if (reduced) { draw(0); log("i", "Mascot: still (reduce-motion setting)"); }
  else {
    let last = performance.now();
    const tick = now => {
      const dt = Math.min(1 / 30, (now - last) / 1000); last = now;                     // frame-rate independent, capped
      if (!document.hidden && s.visible) { try { update(dt, now); } catch (e) { log("e", "Mascot: " + e.message); return; } }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    log("i", `Mascot ready (${touch ? "touch" : "mouse"} mode)`);
  }
  return {
    react(kind) { s.browT = 1; s.blinkT = 0; if (kind === "happy") s.smileT = 1; svg.classList.remove("hop"); void svg.getBoundingClientRect(); svg.classList.add("hop"); },
    lookAt(el, ms = 1600) { if (!el) return; const r = el.getBoundingClientRect(); s.tap = { x: r.left + r.width / 2, y: r.top + r.height / 2, until: performance.now() + ms }; },
    get state() { return { yaw: s.yaw, eyeYaw: s.ey, blink: s.blink, brow: s.brow }; }
  };
}

let lastSay = "", tipIdx = 0, tipAt = 0;
const TIPS = [
  ["Meet at the <b>main gate</b>, not outside rooms. Autos don't wait long 🏃", "<b>मेन गेट</b> पर मिलें, कमरे के बाहर नहीं। ऑटो ज़्यादा देर नहीं रुकता 🏃"],
  ["One person pays the driver, the rest tap <b>Pay via UPI</b>. Done 💸", "एक व्यक्ति ड्राइवर को दे, बाकी <b>UPI से दें</b> दबाएँ। हो गया 💸"],
  ["Can't make it? Tap <b>Leave</b> so others aren't stuck waiting 🙏", "नहीं आ पा रहे? <b>छोड़ें</b> दबाएँ ताकि कोई इंतज़ार न करे 🙏"],
  ["Free shuttle beats ₹80. Check the <b>times above</b> first 🚌", "मुफ़्त शटल ₹80 से बेहतर। पहले <b>ऊपर समय</b> देखें 🚌"],
  ["No fixed time? Turn on the <b>💡 bulb</b> and I'll find company", "समय तय नहीं? <b>💡 बल्ब</b> चालू करें, मैं साथी ढूँढूँगा"],
  ["Same time every day? Tick <b>⭐ Save as usual</b> and post in one tap", "रोज़ एक ही समय? <b>⭐ रोज़ की राइड</b> सेव करें, एक टैप में पोस्ट"],
  ["Reached the gate? Tap <b>📍 I'm at the gate</b> so others hurry up", "गेट पर पहुँच गए? <b>📍 मैं गेट पर हूँ</b> दबाएँ ताकि बाकी जल्दी आएँ"],
  ["More people on AutoPool = fuller autos. <b>📣 Invite friends</b> at the bottom", "जितने ज़्यादा लोग, उतने भरे ऑटो। नीचे <b>📣 दोस्तों को बुलाएँ</b>"],
  ["Be kind to the driver. Confirm the fare <b>before</b> you sit 🛺", "ड्राइवर से अच्छे से बात करें। बैठने से <b>पहले</b> किराया पक्का करें 🛺"],
];
function say() {
  const now = Date.now(), L = live(), mine = myRide(), B = liveBulbs(tab), mb = myBulb();
  const here = L.filter(r => r.dir === tab && C.seats - used(r) > 0), sh = nextShuttle(tab);
  const hr = new Date().getHours(), night = hr >= 21 || hr < 6, S = settleRides();
  let t = null, sub = "", mood = "", extra = "";
  if (mine) {
    const ms = mine.leaveAt - now, mins = Math.ceil(ms / 60000), n = used(mine), my = meIn(mine);
    const others = mine.riders.filter(x => x.uid !== api.uid), notHere = others.filter(x => !x.gate);
    const owner = mine.creator === api.uid, boss = mine.riders.find(x => x.uid === mine.creator);
    if (ms <= 0) { t = tr(`🛺 It's time! ${n} of you, <b>₹${perHead(n)} each</b> (₹${fareFor(n)} total).`, `🛺 समय हो गया! ${n} लोग, <b>₹${perHead(n)} प्रति व्यक्ति</b> (कुल ₹${fareFor(n)})।`);
      sub = tr("One person pays the driver, then settle up here.", "एक व्यक्ति ड्राइवर को दे, फिर यहाँ हिसाब करें।"); mood = "good"; }
    else if (my.gate && notHere.length) { t = tr(`📍 You're at the gate. Waiting for <b>${notHere.map(x => esc(x.name)).join(", ")}</b>.`, `📍 आप गेट पर हैं। <b>${notHere.map(x => esc(x.name)).join(", ")}</b> का इंतज़ार।`);
      sub = tr("Give them a call if they're late.", "देर हो रही हो तो कॉल कर लें।"); }
    else if (my.gate) { t = tr("📍 Everyone's at the gate. Let's go! 🎉", "📍 सब गेट पर हैं। चलो! 🎉"); mood = "good"; }
    else if (ms <= 2 * 60000) { t = tr(`⏰ <b>${mins <= 1 ? "Under a minute" : mins + " min"}!</b> Be at the main gate now. Don't be late!`, `⏰ <b>${mins <= 1 ? "1 मिनट से कम" : mins + " मिनट"}!</b> अभी मेन गेट पहुँचें। देर मत करना!`);
      sub = others.length ? tr("Others are counting on you.", "बाकी आप पर भरोसा कर रहे हैं।") : ""; mood = "urgent"; }
    else if (!owner && boss) { t = tr(`📞 Call <b>${esc(boss.name)}</b> and confirm, so they hold the auto for you.`, `📞 <b>${esc(boss.name)}</b> को कॉल करके पक्का करें, ताकि वे ऑटो रोकें।`);
      sub = tr(`Leaves ${fmt(new Date(mine.leaveAt))} · be sharp!`, `${fmt(new Date(mine.leaveAt))} पर निकलेगा · समय पर रहें!`); }
    else if (owner && !others.length) { extra = `<button class="btn g bj" data-sharebub="${mine.id}">📣 ${tr("Share on WhatsApp", "WhatsApp पर भेजें")}</button>`; t = tr("No one joined yet. <b>Share on WhatsApp</b> to fill seats faster 📣", "अभी कोई नहीं जुड़ा। सीटें जल्दी भरने के लिए <b>WhatsApp पर भेजें</b> 📣");
      sub = tr(`You're leaving at ${fmt(new Date(mine.leaveAt))}.`, `आप ${fmt(new Date(mine.leaveAt))} पर निकल रहे हैं।`); }
    else if (owner) { t = tr(`👥 ${others.length} joined! Call <b>${esc(others[0].name)}</b> to confirm they're coming.`, `👥 ${others.length} जुड़े! <b>${esc(others[0].name)}</b> को कॉल करके पक्का करें।`);
      sub = tr(`Leave your room 2 min before ${fmt(new Date(mine.leaveAt))}.`, `${fmt(new Date(mine.leaveAt))} से 2 मिनट पहले कमरे से निकलें।`); }
    if (n >= C.seats && ms > 0 && !my.gate) { sub = tr(`Auto full · ₹${perHead(n)} each.`, `ऑटो भरा · ₹${perHead(n)} प्रति व्यक्ति।`); if (mood !== "urgent") mood = "good"; }
  }
  else if (S.length) { const r = S[0], p = r.payer && r.riders.find(x => x.uid === r.payer);
    t = !p ? tr("💸 Who paid the driver? Tap it in <b>Settle up</b> above.", "💸 ड्राइवर को किसने दिए? ऊपर <b>हिसाब करें</b> में बताएँ।")
      : p.uid === api.uid ? tr("💸 I'll remind the others to pay you back.", "💸 मैं बाकियों को आपको पैसे लौटाने को कहूँगा।")
      : meIn(r).paid ? tr("✅ All paid. Thanks for pooling! 🙌", "✅ सब चुकता। पूलिंग के लिए धन्यवाद! 🙌")
      : tr(`💸 Pay <b>${esc(p.name)}</b> back. One tap with UPI above.`, `💸 <b>${esc(p.name)}</b> को पैसे लौटाएँ। ऊपर UPI से एक टैप में।`);
    mood = "good"; }
  else if (mb && mb.dir === tab && B.length < 2) { t = tr("💡 You're flexible. I'll buzz you the moment someone else is free.", "💡 आप फ़्री हैं। कोई और फ़्री होते ही बताऊँगा।"); sub = tr(`Till ${fmt(new Date(mb.until))}.`, `${fmt(new Date(mb.until))} तक।`); }
  else if (B.length >= 2) { t = tr(`💡 <b>${B.length} people flexible</b> to ${lbl(tab)}. Fix a time and go!`, `💡 <b>${B.length} लोग फ़्री</b> ${lbl(tab)} जाने को। समय तय करें और चलें!`);
    sub = tr(`₹${perHead(Math.min(B.length, C.seats))} each if you all go.`, `सब जाएँ तो ₹${perHead(Math.min(B.length, C.seats))} प्रति व्यक्ति।`); mood = "good"; }
  else if (here.length) { const r = here[0], m = Math.max(0, Math.ceil((r.leaveAt - now) / 60000));
    extra = `<button class="btn g bj" data-joinbub="${r.id}">🙋 ${tr("Join", "जुड़ें")} ${esc(r.riders.find(x => x.uid === r.creator)?.name || "")}</button>`;
    t = tr(`🛺 Auto to ${lbl(tab)} in <b>${m} min</b>. Hop in, pay ₹${perHead(used(r) + 1)}!`, `🛺 ${lbl(tab)} का ऑटो <b>${m} मिनट</b> में। जुड़ें, सिर्फ़ ₹${perHead(used(r) + 1)}!`);
    sub = here.length > 1 ? tr(`+${here.length - 1} more below`, `नीचे ${here.length - 1} और`) : tr("Tap Join, then call them to confirm.", "जुड़ें दबाएँ, फिर कॉल करके पक्का करें।"); }
  else if (sh.mins <= 10) { t = tr(`🚌 Free shuttle in <b>${sh.mins} min</b>. Save your ₹${fareFor(1)}!`, `🚌 मुफ़्त शटल <b>${sh.mins} मिनट</b> में। ₹${fareFor(1)} बचाएँ!`);
    sub = tr("Walk to the stop now.", "अभी स्टॉप की ओर चलें।"); mood = "good"; }
  if (!t && night) { t = tr("🌙 Late ride? Go in a group. Share the auto, stay safe.", "🌙 देर रात? ग्रुप में जाएँ। ऑटो शेयर करें, सुरक्षित रहें।"); sub = tr("Tell a friend when you leave.", "निकलते समय किसी दोस्त को बता दें।"); }
  if (!t) {   // nothing urgent → rotate friendly tips every 9 s
    if (now - tipAt > 9000) { tipIdx = (tipIdx + 1) % TIPS.length; tipAt = now; }
    t = tr(...TIPS[tipIdx]); sub = tr(`Going to ${lbl(tab)}? Tap the yellow button.`, `${lbl(tab)} जाना है? पीला बटन दबाएँ।`);
  }
  const html = t + (sub ? `<small>${sub}</small>` : "") + extra;
  if (html !== lastSay) {
    const first = !lastSay, urgentNow = mood === "urgent" && !$("#bub").classList.contains("urgent");
    lastSay = html; const b = $("#bub"); b.innerHTML = html;
    b.classList.toggle("urgent", mood === "urgent"); b.classList.toggle("good", mood === "good");
    b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 250);
    if (urgentNow) { mascot?.react(); navigator.vibrate?.([100, 60, 100]); }
    else if (first && here.length && !mine) { mascot?.react("happy"); setTimeout(() => mascot?.lookAt($(".ride"), 2200), 300); }
  }
}

/* ---------------- Install as app (Android + iPhone) ---------------- */
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let deferredPrompt = null;
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(e => log("w", "Service worker failed: " + e.message));
const showInst = () => { if (!isStandalone && localStorage.getItem("ap_instX") !== "1") $("#instBar").style.display = "flex"; };
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; showInst(); });   // Android Chrome
if (isIOS) showInst();
$("#instBtn").onclick = async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; log("i", "Install: " + r.outcome); deferredPrompt = null; $("#instBar").style.display = "none"; }
  else if (isIOS) open("#ovIos");
  else toast(tr("Use your browser menu (⋮) → Install app / Add to Home screen", "ब्राउज़र मेन्यू (⋮) → Install app / Add to Home screen चुनें"));
};
$("#instX").onclick = () => { localStorage.setItem("ap_instX", "1"); $("#instBar").style.display = "none"; };
window.addEventListener("appinstalled", () => { log("i", "App installed"); $("#instBar").style.display = "none"; });

/* ---------------- Auto-update: if a newer version is online, refresh ---------------- */
async function checkUpdate() {
  if (!location.protocol.startsWith("http") || !navigator.onLine) return;
  try {
    const t = await (await fetch("index.html?v=" + Date.now(), { cache: "no-store" })).text();
    const v = (t.match(/APP_VERSION = "([^"]+)"/) || [])[1];
    if (!v || v === APP_VERSION) return;
    log("i", `Update found: ${APP_VERSION} → ${v}`);
    const busy = document.querySelector(".ov.show");                 // don't reload in the middle of posting/joining
    if (busy) { toast(tr("✨ New version ready. It'll load when you close this.", "✨ नया वर्ज़न तैयार है। इसे बंद करते ही लोड होगा।"), 4000); return; }
    toast(tr("✨ Updating AutoPool…", "✨ AutoPool अपडेट हो रहा है…"), 1500);
    setTimeout(() => location.reload(), 1200);
  } catch (e) { log("w", "Update check failed: " + e.message); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });   // every time the app is reopened
setInterval(checkUpdate, 5 * 60 * 1000);
setTimeout(checkUpdate, 4000);
log("i", "App version " + APP_VERSION);

/* ---------------- Boot ---------------- */
async function start() {
  if (started) return; started = true;
  tab = localStorage.getItem("ap_tab") || (new Date().getHours() >= 13 && new Date().getHours() < 21 ? "m2c" : "c2m");
  document.querySelectorAll(".tabs button").forEach(x => { x.classList.toggle("on", x.dataset.d === tab); x.setAttribute("aria-selected", x.dataset.d === tab); });
  try { mascot = window.__mascot = initMascot(); } catch (e) { log("e", "Mascot failed: " + e.message); }
  await initBackend();
  api.saveUser(me).then(() => log("i", "Registration saved")).catch(e => log("w", "Registration save failed: " + e.message));
  api.watch((rs, added) => {
    rides = rs;
    added.map(id => rs.find(r => r.id === id))
      .filter(r => r && r.creator !== api.uid && r.createdAt > bootAt && !r.cancelled)
      .forEach(alertNew);
    render();
  });
  let bulbBoot = true;
  api.watchBulbs(bs => {
    const mb = bs.find(b => b.uid === api.uid && b.until > Date.now());
    if (!bulbBoot && mb) {
      const fresh = bs.filter(b => b.dir === mb.dir && b.uid !== api.uid && b.until > Date.now() && !bulbs.some(o => o.uid === b.uid && o.dir === b.dir && o.until > Date.now()));
      fresh.forEach(b => { mascot?.react("happy"); toast(tr(`💡 ${b.name} is also flexible to ${lbl(b.dir)} (${bs.filter(x => x.dir === mb.dir && x.until > Date.now()).length} now)`, `💡 ${b.name} भी ${lbl(b.dir)} जाने को फ़्री (अब ${bs.filter(x => x.dir === mb.dir && x.until > Date.now()).length})`), 4500); navigator.vibrate?.(150); });
    }
    bulbBoot = false; bulbs = bs; render();
  });
  // rides you're already in when the app opens: don't buzz for a reminder that is already overdue
  live().forEach(r => { if (meIn(r) && r.leaveAt - Date.now() <= 180000) reminded.add(r.id); });
  renderShuttle(); render();
  let lastCount = -1, lastBulbs = -1, lastSettle = -1;
  setInterval(() => {
    const n = live().length, bn = bulbs.filter(b => b.until > Date.now()).length, sn = settleRides().length;
    checkReminder();
    if (n !== lastCount || bn !== lastBulbs || sn !== lastSettle) { lastCount = n; lastBulbs = bn; lastSettle = sn; return render(); }   // a card appeared/expired → full re-render
    try { say(); } catch (e) {}
    document.querySelectorAll(".cd[data-at]").forEach(el => {   // otherwise just tick countdowns
      const ms = +el.dataset.at - Date.now();
      el.textContent = cdText(ms);
      el.classList.toggle("go", ms < 60000);
    });
  }, 1000);
  setInterval(renderShuttle, 30000);
}
applyStatic();
setBig(localStorage.getItem("ap_big") === "1");
if (me) start(); else $("#login").classList.add("show");
</script>
